; 판단 엔진(treagent/)과 그 테스트만 strict 로 본다.
; chain/ · mock_data · services/ 는 1~3단계에서 float 규약으로 작성된 기존 코드다.
; 이번 세션의 범위가 아니므로 타입 오류를 여기서 고치지 않는다. 다만 import 는
; 따라가야 시그니처 불일치를 잡을 수 있어 follow_imports 는 켜둔다.

[mypy]
python_version = 3.12
strict = True
files = treagent, tests
plugins =

[mypy-chain.*]
ignore_errors = True

[mypy-mock_data]
ignore_errors = True

[mypy-services.*]
ignore_errors = True

[mypy-config]
ignore_errors = True
