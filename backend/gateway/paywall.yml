# TreAgent 자체 x402 게이트웨이 — Gemini 추론 결제 수취 측.
#
# 왜 자체 게이트웨이인가
# ----------------------
# 대회 규정상 Solana mainnet 을 쓸 수 없다. 공식 카탈로그의 Gemini 게이트웨이
# (generativelanguage.google.gateway-402.com) 는 402 챌린지에서 mainnet 만
# 광고하므로(`solana:5eykt4UsFv8P8NJdTREpY1vzqKqZKvdp`) 규정 안에서 결제할 수
# 없다. `pay --sandbox` 로 시도하면 다음과 같이 거부된다.
#
#   Payment rejected: you forced network `localnet` but the server expects `mainnet`.
#
# 그래서 결제 **수취 측**을 우리가 구현한다. 업스트림은 진짜 Gemini API 이고,
# 402 챌린지·USDC 결제·200 응답이 전부 실제로 일어난다. 결제 우회가 아니다 —
# 에이전트는 여전히 돈을 내야만 추론을 받는다.
#
# 기동
# ----
#   set -a && source ../.env && set +a
#   pay --sandbox gate api backend/gateway/paywall.yml --bind 127.0.0.1:1402
#
# GEMINI_API_KEY 는 **이 파일에 적지 않는다.** 게이트웨이가 실행 셸의
# 환경변수에서 직접 읽어 업스트림 헤더로 주입한다 (routing.auth.value_from_env).

name: treagent-gemini
subdomain: treagent-gemini
title: "Gemini Inference (TreAgent x402 Gateway)"
description: "TreAgent 판단 엔진의 추론 요청을 USDC 로 과금하는 자체 x402 게이트웨이."
category: ai_ml
version: v1

routing:
  type: proxy
  url: https://generativelanguage.googleapis.com/
  auth:
    method: header
    key: x-goog-api-key
    value_from_env: GEMINI_API_KEY

operator:
  # localnet 고정. mainnet 으로 바꾸면 규정 위반이다.
  network: localnet
  currencies:
    usd: ["USDC"]
  # 게이트웨이가 수수료를 대납한다. 클라이언트 지갑에 SOL 이 없어도 결제가 성립한다.
  fee_payer: true

endpoints:
  # 무료 — 모델 목록. 헬스체크 겸 "이 게이트웨이가 실제로 어떤 모델을 주는가" 를
  # 확인하는 창구다. 여기서 확정한 이름이 TREAGENT_GEMINI_MODEL 의 근거가 된다.
  - method: GET
    path: "v1beta/models"
    resource: "catalog"
    description: "List available Gemini models"

  # 유료 — 판단 계획 생성. 이 한 줄이 데모의 재귀 루프를 만든다.
  # 에이전트가 자기 추론 비용을 USDC 로 내고, 그 지출이 다음 사이클의
  # Operations Wallet 부족분 예측 대상이 된다.
  - method: POST
    path: "v1beta/models/{modelsId}:generateContent"
    resource: "inference"
    description: "Generate a TreAgent decision plan"
    metering:
      dimensions:
        - direction: usage
          unit: requests
          scale: 1
          tiers:
            - price_usd: 0.05
